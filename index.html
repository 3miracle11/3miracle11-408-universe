<script>
const SUBJECTS=[
 {id:'ds',name:'数据结构',color:'#b8d8d3',start:-2.75,chapters:[
  ['绪论',[['基本概念','数据、数据元素、数据对象与抽象数据类型；逻辑结构、存储结构和数据运算。','逻辑结构与物理结构|算法五个特性|抽象数据类型'],['算法分析','理解算法效率，以时间复杂度与空间复杂度衡量资源开销。','渐进复杂度|最好、最坏与平均情形|递归复杂度']]],
  ['线性表',[['顺序表','掌握线性表的顺序存储、基本操作及其时间复杂度。','插入与删除|动态分配|元素移动次数'],['单链表','掌握带头结点与不带头结点单链表的建立、查找、插入和删除。','头插与尾插|逆置|双指针'],['双链表与循环链表','理解双向链接与循环结构的操作边界和适用场景。','前驱与后继|循环终止条件|静态链表']]],
  ['栈、队列和数组',[['栈','掌握栈的顺序与链式存储，理解后进先出约束及应用。','共享栈|表达式求值|括号匹配'],['队列','掌握循环队列、链队列与双端队列的结构和操作。','队空队满判定|循环队列容量|受限双端队列'],['栈和队列的应用','运用栈与队列解决递归、层次遍历和调度问题。','递归转非递归|BFS|进制转换'],['特殊矩阵与稀疏矩阵','掌握数组存储地址计算及对称、三角、三对角矩阵的压缩存储。','行优先与列优先|下标映射|三元组表']]],
  ['串',[['串的存储与模式匹配','理解串的定长、堆分配存储和朴素模式匹配。','子串定位|匹配复杂度|存储方式'],['KMP 算法','掌握前缀函数、next 数组及改进的 nextval。','最长相等前后缀|失配跳转|手算 next']]],
  ['树与二叉树',[['树的基本概念','掌握结点度、层次、高度、路径及森林等基本性质。','结点数关系|高度边界|有序树'],['二叉树性质与存储','掌握二叉树、完全二叉树的性质及顺序和链式存储。','完全二叉树编号|叶结点计数|二叉链表'],['二叉树遍历','掌握先序、中序、后序、层序遍历及由序列构造二叉树。','递归与非递归|线索二叉树|唯一性条件'],['树、森林与二叉树转换','掌握孩子兄弟表示法与三者间的遍历对应关系。','左孩子右兄弟|森林转换|遍历序列'],['哈夫曼树与编码','掌握带权路径长度、最优二叉树构造与前缀编码。','WPL|贪心合并|编码长度'],['并查集','掌握集合合并、查找、路径压缩与按秩合并。','双亲表示|近常数复杂度|连通性']]],
  ['图',[['图的基本概念','理解有向图、无向图、简单图、连通性、度和路径。','度数之和|强连通|生成子图'],['图的存储','掌握邻接矩阵、邻接表、十字链表和邻接多重表。','空间复杂度|出入度统计|稠密与稀疏'],['广度与深度优先搜索','掌握 BFS、DFS 过程、生成树及复杂度分析。','队列与递归|遍历森林|连通分量'],['最小生成树','掌握 Prim 与 Kruskal 算法的思想、步骤及适用图。','切分性质|并查集|复杂度比较'],['最短路径','掌握 Dijkstra、Floyd 算法及单源和多源最短路径。','松弛操作|负权限制|路径还原'],['拓扑排序与关键路径','掌握 DAG 的拓扑序、AOE 网关键活动和工程工期。','入度法|ve/vl|环检测']]],
  ['查找',[['顺序与折半查找','掌握查找判定树、平均查找长度和折半边界。','ASL|有序表|失败结点'],['分块查找','理解索引顺序查找的分块策略与效率。','索引表|块内查找|块长选择'],['二叉排序树','掌握 BST 的查找、插入、删除及性能退化。','中序有序|删除三种情形|ASL'],['平衡二叉树','掌握 AVL 平衡因子及 LL、RR、LR、RL 旋转。','最小结点数|插入调整|旋转定位'],['红黑树','理解红黑性质、黑高与插入删除调整的基本思想。','最长路径界|染色|旋转'],['B 树与 B+ 树','掌握多路平衡查找树的结构、查找、插入和删除。','阶与关键字数|分裂合并|叶结点链'],['散列表','掌握散列函数、冲突处理和装填因子对性能的影响。','开放定址|拉链法|成功失败 ASL']]],
  ['排序',[['排序基本概念','理解稳定性、内部与外部排序及评价指标。','时空复杂度|稳定性|移动次数'],['插入与希尔排序','掌握直接插入、折半插入和希尔排序过程。','哨兵|增量序列|稳定性'],['交换排序','掌握冒泡排序与快速排序的划分、递归和复杂度。','枢轴选择|最坏情形|空间复杂度'],['选择与堆排序','掌握简单选择排序、堆的调整与堆排序过程。','建堆|向下调整|Top K'],['归并与基数排序','掌握二路归并、基数排序的趟数与适用条件。','辅助空间|稳定性|最低位优先'],['外部排序','理解置换选择、最佳归并树与多路平衡归并。','败者树|归并趟数|缓冲区']]]
 ]},
 {id:'co',name:'计算机组成原理',color:'#e5c08a',start:-1.15,chapters:[
  ['计算机系统概述',[['计算机系统层次结构','理解硬件与软件、各级语言及翻译程序之间的关系。','机器语言|汇编与高级语言|透明性'],['计算机性能指标','掌握吞吐量、响应时间、CPU 时间、CPI、MIPS 与加速比。','主频与时钟周期|Amdahl 定律|基准程序']]],

  ['存储系统',[['存储器层次结构','理解局部性原理、层次化存储与性能指标。','命中率|平均访问时间|带宽'],['主存储器','掌握 SRAM、DRAM、ROM 特性与存储器芯片扩展。','刷新|位扩展与字扩展|地址译码'],['多模块存储器','掌握单体多字与低位交叉编址的并行访问。','流水访问|带宽|冲突'],['Cache 基本原理','掌握 Cache 与主存地址映射、替换和写策略。','直接映射|组相联|写回与写直达'],['Cache 性能计算','计算命中率、缺失代价、平均访问时间并分析优化。','块大小|多级 Cache|AMAT'],['虚拟存储器','理解页式虚拟存储、TLB、页表与 Cache 的协同。','地址转换|缺页|TLB 与 Cache 次序']]],

const canvas=document.querySelector('#space'),ctx=canvas.getContext('2d',{alpha:true}),galaxy=document.querySelector('#galaxy');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,time=0,hover=null,selected=null,drag=false,moved=false,last={x:0,y:0};
const camera={x:0,y:0,zoom:.62,targetX:0,targetY:0,targetZoom:.62};
const nodes=[],links=[],bgStars=[];let active=new Set(SUBJECTS.map(s=>s.id)),query='';
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return()=>((h=Math.imul(h^(h>>>13),1274126177))>>>0)/4294967296};

function buildUniverse(){
 SUBJECTS.forEach((s,si)=>{const span=1.18,center=s.start+span/2;const core={id:s.id,name:s.name,subject:s,level:0,x:Math.cos(center)*225,y:Math.sin(center)*225,r:15,desc:`${s.name}大纲知识星系`,points:['点击章节恒星继续探索'],path:'408'};nodes.push(core);
  s.chapters.forEach((ch,ci)=>{const a=s.start+(ci+.5)/s.chapters.length*span;const rr=480+ci%2*50;const cn={id:`${s.id}-${ci}`,name:ch[0],subject:s,level:1,x:Math.cos(a)*rr,y:Math.sin(a)*rr,r:8,desc:`${s.name}中的${ch[0]}知识群。`,points:ch[1].map(x=>x[0]),path:s.name};nodes.push(cn);links.push([core,cn]);
   ch[1].forEach((p,pi)=>{const rand=hash(s.id+ci+'-'+pi),offset=(pi-(ch[1].length-1)/2)*.105+(rand()-.5)*.035,r=760+ci*27+(pi%2)*72;const n={id:`${s.id}-${ci}-${pi}`,name:p[0],subject:s,level:2,x:Math.cos(a+offset)*r,y:Math.sin(a+offset)*r,r:4.2+(rand()*2.2),desc:p[1],points:p[2].split('|'),path:`${s.name} / ${ch[0]}`};nodes.push(n);links.push([cn,n]);
   });
  });
 });
 for(let i=0;i<850;i++){const r=Math.random();bgStars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.15,a:Math.random()*.7+.12,p:Math.random()*6.28,z:r*r});}
}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(!bgStars.length)buildUniverse()}
const screen=n=>({x:W/2+(n.x-camera.x)*camera.zoom,y:H/2+(n.y-camera.y)*camera.zoom});
function nebula(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c+'22');g.addColorStop(.35,c+'0e');g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){
 time+=reduce?0:.008;camera.x+=(camera.targetX-camera.x)*.08;camera.y+=(camera.targetY-camera.y)*.08;camera.zoom+=(camera.targetZoom-camera.zoom)*.09;
 ctx.clearRect(0,0,W,H);galaxy.style.setProperty('--px',Math.max(-22,Math.min(22,-camera.x*.012))+'px');galaxy.style.setProperty('--py',Math.max(-16,Math.min(16,-camera.y*.009))+'px');
 const sky=ctx.createRadialGradient(W*.48,H*.46,0,W*.48,H*.46,Math.max(W,H)*.7);sky.addColorStop(0,'rgba(5,15,27,.08)');sky.addColorStop(.48,'rgba(2,7,14,.18)');sky.addColorStop(1,'rgba(1,3,8,.52)');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 bgStars.forEach((s,i)=>{let x=(s.x-camera.x*s.z*.018)%W;if(x<0)x+=W;let y=(s.y-camera.y*s.z*.018)%H;if(y<0)y+=H;const tw=reduce?1:.72+.28*Math.sin(time*2+s.p+i);ctx.globalAlpha=s.a*tw;ctx.fillStyle='#d8ecff';ctx.fillRect(x,y,s.r,s.r)});ctx.globalAlpha=1;
 SUBJECTS.forEach(s=>{if(!active.has(s.id))return;const core=nodes.find(n=>n.id===s.id),p=screen(core);nebula(p.x,p.y,440*camera.zoom,s.color)});
 ctx.lineWidth=.6;links.forEach(([a,b])=>{if(!active.has(a.subject.id))return;const A=screen(a),B=screen(b);ctx.strokeStyle=a.subject.color+(query&&!matches(b)?'08':'20');ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()});
 hover=null;const mx=pointer.x,my=pointer.y;
 nodes.forEach(n=>{if(!active.has(n.subject.id))return;const p=screen(n),isMatch=matches(n),dim=query&&!isMatch;if(p.x<-80||p.x>W+80||p.y<-80||p.y>H+80)return;let rr=Math.max(1.4,n.r*camera.zoom),pulse=1+(reduce?0:Math.sin(time*3+n.x)*.09);if(Math.hypot(mx-p.x,my-p.y)<Math.max(11,rr+7))hover=n;ctx.globalAlpha=dim?.09:1;
  if(n.level<2||n===selected||n===hover||isMatch&&query){const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr*7);glow.addColorStop(0,n.subject.color+'bb');glow.addColorStop(.18,n.subject.color+'50');glow.addColorStop(1,n.subject.color+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,rr*7,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=n===selected?'#ffffff':n.subject.color;ctx.beginPath();ctx.arc(p.x,p.y,rr*pulse,0,Math.PI*2);ctx.fill();
  const show=n.level<2||camera.zoom>1.05||n===hover||(query&&isMatch);if(show){ctx.globalAlpha=dim?.12:n.level===2?.72:1;ctx.fillStyle='#dcecff';ctx.font=`${n.level===0?600:500} ${Math.max(10,n.level===0?15:n.level===1?12:10)}px "Microsoft YaHei UI"`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(n.name,p.x+rr+7,p.y)}ctx.globalAlpha=1;
 });
 canvas.style.cursor=drag?'grabbing':hover?'pointer':'grab';requestAnimationFrame(draw)
}
const pointer={x:-999,y:-999};function matches(n){return !query||`${n.name}${n.path}${n.desc}${n.points.join('')}`.toLowerCase().includes(query)}
function setZoom(z){camera.targetZoom=Math.max(.35,Math.min(2.5,z))}
function reset(){camera.targetX=0;camera.targetY=0;setZoom(innerWidth<700?.42:.62);selected=null;details.classList.remove('open')}
function show(n){selected=n;details.style.setProperty('--node-color',n.subject.color);dSubject.textContent=n.subject.name;dTitle.textContent=n.name;dPath.textContent=n.path;dDesc.textContent=n.desc;dPoints.innerHTML=n.points.map(x=>`<li>${x}</li>`).join('');details.classList.add('open');intro.classList.add('gone');hint.classList.add('hide')}

const legend=document.querySelector('.legend'),details=document.querySelector('#details'),intro=document.querySelector('#intro');
SUBJECTS.forEach(s=>{const b=document.createElement('button');b.className='filter active';b.style.setProperty('--c',s.color);b.textContent=s.name;b.onclick=()=>{active.has(s.id)?active.delete(s.id):active.add(s.id);b.classList.toggle('active',active.has(s.id));status.textContent=`${nodes.filter(n=>active.has(n.subject.id)).length} 颗知识星体`};legend.appendChild(b)});
status.textContent=`${nodes.length} 颗知识星体 · 4 条学科星河`;
canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;if(drag){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;camera.targetX-=dx/camera.zoom;camera.targetY-=dy/camera.zoom;last={x:e.clientX,y:e.clientY};intro.classList.add('gone')}});canvas.addEventListener('pointerup',()=>{drag=false;if(!moved&&hover)show(hover)});canvas.addEventListener('pointerleave',()=>{drag=false;pointer.x=-999});canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(camera.targetZoom*Math.exp(-e.deltaY*.001));intro.classList.add('gone')},{passive:false});
document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();const hit=nodes.find(matches);if(query&&hit){camera.targetX=hit.x;camera.targetY=hit.y;setZoom(1.25);status.textContent=`找到 ${nodes.filter(matches).length} 个相关知识点`}else status.textContent=query?'未找到匹配知识点':`${nodes.length} 颗知识星体 · 4 条学科星河`});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.querySelector('#search').focus()}if(e.key==='Escape'){details.classList.remove('open');document.querySelector('#search').blur()}});

}
